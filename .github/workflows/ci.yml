name: CI

on:
  push:
  pull_request:

# Шаги проверяют наличие файлов через hashFiles: пока части проекта нет (например, фронтенда в самом
# первом PR), соответствующая проверка пропускается, а не падает. Как только файлы появились,
# проверка выполняется по-настоящему.

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests with coverage (threshold 70%)
        if: hashFiles('tests/**/*.py') != ''
        run: pytest --cov=app --cov=ml --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - uses: actions/upload-artifact@v4
        if: hashFiles('tests/**/*.py') != ''
        with:
          name: coverage-report
          path: coverage.xml

  migrations:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://clinic:clinic@localhost:5432/clinic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Upgrade, downgrade, upgrade again
        if: hashFiles('alembic.ini') != ''
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Models match migrations
        if: hashFiles('alembic.ini') != ''
        run: alembic check
      - name: Seed and ETL smoke test
        if: hashFiles('app/etl/import_data.py') != ''
        run: |
          python -m app.seed
          python -m app.etl.import_data --source data/raw/cardio_train.csv --limit 2000 --score
          python -m app.etl.import_data --source data/raw/cardio_train.csv --limit 2000 --score

  frontend:
    name: Frontend (eslint + prettier + node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm ci
      - name: Lint
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm run lint
      - name: Test
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm test

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        if: hashFiles('Dockerfile') != ''
        run: docker build -t cardio-clinic .
