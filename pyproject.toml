[project]
name = "cardio-risk-service"
version = "1.0.0"
description = "ML-сервис оценки риска сердечно-сосудистых заболеваний (FastAPI + scikit-learn)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
# X/X_train — общепринятая нотация в ML-коде.
ignore = ["N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning"]
